<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentWise - Smart Rental Discovery Kenya</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #2ecc71; color: white; border: none; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .warning { background-color: #ffdddd; border-left: 6px solid #f44336; }
        .success { background-color: #ddffdd; border-left: 6px solid #4CAF50; }
    </style>
</head>
<body>

    <header>
        <h1>🏠 RentWise</h1>
        <p>Find affordable rentals in Kenya with smart financial insights.</p>
    </header>

    <main class="container">
        <h3>Budget & Location Check</h3>
        
        <label for="income">Your Monthly Income (KES):</label>
        <input type="number" id="income" placeholder="e.g., 80000">

        <label for="location">Select Desired Location:</label>
        <select id="location">
            <option value="nairobi-roysambu">Roysambu (Nairobi) - Est. Rent: KES 18,000</option>
            <option value="nairobi-kilimani">Kilimani (Nairobi) - Est. Rent: KES 45,000</option>
            <option value="kiambu-ruiru">Ruiru (Kiambu) - Est. Rent: KES 22,000</option>
            <option value="kiambu-thika">Thika (Kiambu) - Est. Rent: KES 15,000</option>
        </select>

        <button type="button" onclick="calculateAffordability()">Analyze Rent Affordability</button>

        <div id="result" class="result-box"></div>
    </main>

    <script>
        function calculateAffordability() {
            const income = parseFloat(document.getElementById('income').value);
            const locationSelect = document.getElementById('location');
            const selectedValue = locationSelect.value;
            
            if (!income || income <= 0) {
                alert("Please enter a valid monthly income.");
                return;
            }
            let rent = 0;
            let serviceCharge = 0;
            let name = "";

            if (selectedValue === "nairobi-roysambu") { rent = 18000; serviceCharge = 1500; name = "Roysambu"; }
            else if (selectedValue === "nairobi-kilimani") { rent = 45000; serviceCharge = 3500; name = "Kilimani"; }
            else if (selectedValue === "kiambu-ruiru") { rent = 22000; serviceCharge = 1000; name = "Ruiru"; }
            else if (selectedValue === "kiambu-thika") { rent = 15000; serviceCharge = 1200; name = "Thika"; }

            const recommendedMax = income * 0.30;
            const trueMonthlyCost = rent + serviceCharge;
            const initialMoveIn = (rent * 2) + 5000; // Rent + 1 Month Deposit + estimated agency fee

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = "block";

            let HTMLContent = `<h4>Financial Summary for ${name}:</h4>
                               <p>Total Estimated Move-in Cash: <b>KES ${initialMoveIn.toLocaleString()}</b></p>
                               <p>True Monthly Cost (Rent + Service): <b>KES ${trueMonthlyCost.toLocaleString()}</b></p>`;

            if (trueMonthlyCost > recommendedMax) {
                resultDiv.className = "result-box warning";
                HTMLContent += `<p>⚠️ <b>Warning:</b> This housing option consumes more than the recommended 30% of your income. Your max recommended rent budget is KES ${recommendedMax.toLocaleString()}.</p>`;
            } else {
                resultDiv.className = "result-box success";
                HTMLContent += `<p>✅ <b>Looking Good!</b> This choice fits comfortably within your financial profile budget.</p>`;
            }

            resultDiv.innerHTML = HTMLContent;
        }
    </script>
</body>
</html>
