<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentWise - Smart Rental Discovery Kenya</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        header { text-align: center; margin-bottom: 30px; }
        .search-container { max-width: 600px; margin: 0 auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        select, input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background-color: #2ecc71; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <header>
        <h1>🏠 RentWise</h1>
        <p>Find affordable rentals in Kenya with smart financial insights.</p>
    </header>

    <main>
        <div class="search-container">
            <h3>Search Rentals</h3>
            
            <label for="location">Select Location:</label>
            <select id="location">
                <option value="nairobi">Nairobi (e.g., Kilimani, Westlands, Roysambu)</option>
                <option value="kiambu">Kiambu (e.g., Thika, Ruiru)</option>
                <option value="mombasa">Mombasa</option>
            </select>

            <label for="budget">Your Maximum Monthly Budget (KES):</label>
            <input type="number" id="budget" placeholder="e.g., 25000" min="0">

            <button type="button">Find Best Options</button>
        </div>
    </main>

</body>
</html>
